<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMOAVENTURA 🌡️</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <h1>🌊 TERMOAVENTURA</h1>
            <p>Descubre la magia del enfriamiento</p>
        </header>

        <div class="card">
            <form id="formCalor">
                <div class="form-grid">
                    <div class="input-group">
                        <label>🔥 Temperatura Inicial</label>
                        <input type="number" id="t0" value="120" step="0.1" required>
                        <span class="unit">°C</span>
                    </div>
                    <div class="input-group">
                        <label>❄️ Temperatura del lugar</label>
                        <input type="number" id="ts" value="38" step="0.1" required>
                        <span class="unit">°C</span>
                    </div>
                    <div class="input-group">
                        <label>⚡ Constante k</label>
                        <input type="number" id="k" value="0.45" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label>⏰ Tiempo (horas)</label>
                        <input type="number" id="t" value="3" step="0.1" required>
                        <span class="unit">h</span>
                    </div>
                </div>

                <button type="submit">Ver Evolución Mágica ✨</button>
            </form>

            <div id="resultado" class="resultado"></div>
            
            <div class="chart-container">
                <canvas id="temperatureChart"></canvas>
            </div>
        </div>
    </div>

    <script src="javacrip.js"></script>
</body>
</html>
